      UNIDADE_NOME:  {tipo: string, nulo: false, descricao: Designacao por extenso.}
      UNIDADE_SIGLA: {tipo: string, nulo: false, descricao: "Designacao abreviada, formada segundo o MD33-M-02."}
      ESCALAO_COD:   {tipo: string, nulo: false, dominio: escalao, descricao: Escalao da unidade.}
      SUPERIOR_COD:  {tipo: string, nulo: true, referencia: REF_UNIDADE, descricao: "Unidade imediatamente superior. Vazio so no topo."}

