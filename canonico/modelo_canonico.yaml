# =============================================================================
# MODELO CANONICO — ARQ_TEMAC
# =============================================================================
# Um arquivo, duas metades:
#
#   entidades   as tabelas de destino: quais colunas existem e o que cada uma e.
#   fontes      o de/para: por onde cada campo de cada sistema chega ate elas.
#
# O job de transformacao le este arquivo e monta o SQL. Nao ha `if fonte == ...`
# no codigo: integrar uma fonte nova e acrescentar um bloco aqui.
#
# NOMES seguem o IR 14-06 (Portaria 011-STI/2004), que rege a atribuicao de
# nomes de dados no Exercito: MAIUSCULAS, termos separados por _, no maximo 30
# caracteres, sem acento, na ordem Propriedade + Representacao.
#
#     FONTE_CONFIABILIDADE_COD
#     |________propriedade_____|_COD = CODIGO (termo de representacao)
#
# O termo final vem de uma lista fechada (canonico/ir_14_06/termos_representacao.csv),
# e as abreviaturas vem do MD33-M-02, o manual das Forcas Armadas.
#
# SIGILO: as fontes sao identificadas por codigo generico (C2_A, C2_B).
# =============================================================================

metadados:
  versao: 2
  atualizado_em: 2026-09-07
  nota: >-
    Versao 2 simplifica a 1: as tabelas de manifesto de imagem e de documento
    viraram uma so (ARQUIVO), as tabelas de alvo e missao de tiro sairam (o
    documento de fogos alimenta EVENTO diretamente) e os codinomes de radio
    viraram sinonimos de dominio em vez de tabela propria.


# =============================================================================
# DOMINIOS — listas de valores permitidos
# =============================================================================
# `sinonimos` e o que faz a integracao funcionar: cada sistema escreve do seu
# jeito e todos convergem para o mesmo valor. Valor que nao casa com nenhum
# sinonimo nao passa despercebido — vira erro de qualidade.
# =============================================================================

dominios:

  sistema_origem:
    descricao: Sistema ou processo que produziu o dado.
    valores:
      SIM:   {rotulo: Simulador de funcoes de combate}
      C2_A:  {rotulo: Aplicativo C2 A}
      C2_B:  {rotulo: Aplicativo C2 B}
      FOGOS: {rotulo: Documentacao de fogos}
      VOZ:   {rotulo: Mensagem de voz}

  modalidade:
    descricao: >-
      Forma fisica em que o dado chegou. E a coluna que sustenta a tese de
      heterogeneidade: permite contar quantas modalidades uma consulta atravessou.
    valores:
      JSON:   {rotulo: JSON estruturado}
      TEXTO:  {rotulo: Texto livre}
      IMAGEM: {rotulo: Imagem}
      AUDIO:  {rotulo: Audio}
      PDF:    {rotulo: Documento digitalizado}

  tipo_evento:
    descricao: Natureza do fato relatado.
    valores:
      POSICAO:             {rotulo: Relato de posicao, sinonimos: [tordilho]}
      AVISTAMENTO:         {rotulo: Avistamento, sinonimos: [potro]}
      AVISTAMENTO_INIMIGO: {rotulo: Avistamento de forca oponente, sinonimos: [cavalo]}
      INCIDENTE:           {rotulo: Incidente, sinonimos: [brasa]}
      OBSTACULO:           {rotulo: Obstaculo, sinonimos: [bigorna]}
      MISSAO_TIRO:         {rotulo: Missao de tiro, sinonimos: [martelo]}
      SITUACAO_MEIO:       {rotulo: Situacao de meio ou material, sinonimos: [engrenagem]}
      SITUACAO_PESSOAL:    {rotulo: Situacao de pessoal, sinonimos: [cantil]}
      SENSOR:              {rotulo: Leitura de sensor, sinonimos: [antena]}
    # Os codinomes de radio entram como SINONIMOS, e nao como tabela separada:
    # 'cavalo' no audio transcrito casa direto com AVISTAMENTO_INIMIGO.

  funcao_combate:
    descricao: Funcao de combate a que o evento pertence.
    valores:
      C2:           {rotulo: Comando e Controle, sinonimos: [torre]}
      MOV_MANOBRA:  {rotulo: Movimento e Manobra, sinonimos: [bussola]}
      INTELIGENCIA: {rotulo: Inteligencia, sinonimos: [luneta]}
      FOGOS:        {rotulo: Fogos, sinonimos: [lanca]}
      PROTECAO:     {rotulo: Protecao, sinonimos: [escudo]}
      LOGISTICA:    {rotulo: Logistica, sinonimos: [celeiro]}

  prioridade:
    descricao: Urgencia atribuida ao tratamento do evento.
    valores:
      URGENTE:     {rotulo: Urgente,     sinonimos: [Alta, Critica, Imediato, relampago]}
      PRIORITARIO: {rotulo: Prioritario, sinonimos: [Media, Moderada, chuva]}
      ROTINA:      {rotulo: Rotina,      sinonimos: [Baixa, Normal, orvalho]}

  confiabilidade:
    descricao: Confiabilidade da fonte. Escala doutrinaria de A a F.
    valores:
      A: {rotulo: Fonte confiavel, sinonimos: [granito]}
      B: {rotulo: Fonte geralmente confiavel}
      C: {rotulo: Fonte razoavelmente confiavel, sinonimos: [arenito]}
      D: {rotulo: Fonte nao usualmente confiavel}
      E: {rotulo: Fonte nao confiavel, sinonimos: [areia]}
      F: {rotulo: Confiabilidade nao pode ser julgada}

  credibilidade:
    descricao: >-
      Credibilidade da informacao. Escala doutrinaria de algarismo, que anda
      junto com a letra da confiabilidade: 'B2' e fonte geralmente confiavel
      com informacao provavelmente verdadeira.
    valores:
      "1": {rotulo: Confirmada por outras fontes}
      "2": {rotulo: Provavelmente verdadeira}
      "3": {rotulo: Possivelmente verdadeira}
      "4": {rotulo: Duvidosa}
      "5": {rotulo: Improvavel}
      "6": {rotulo: Veracidade nao pode ser julgada}

  metodo_localizacao:
    descricao: Como a posicao foi obtida. Explica a precisao.
    valores:
      GPS:       {rotulo: Receptor de navegacao por satelite}
      MANUAL:    {rotulo: Informada pelo operador}
      GAZETTEER: {rotulo: Resolvida por indice de nomes geograficos}
      OCR_COORD: {rotulo: Lida por reconhecimento optico de caractere}

  escalao:
    descricao: Escalao hierarquico da organizacao militar.
    valores:
      BDA: {rotulo: Brigada}
      OM:  {rotulo: Organizacao Militar}
      SU:  {rotulo: Subunidade}
      FR:  {rotulo: Fracao}

  tipo_local:
    descricao: Natureza de uma referencia geografica.
    valores:
      RODOVIA_KM:    {rotulo: Marco quilometrico de rodovia}
      LOCALIDADE:    {rotulo: Povoado ou nucleo habitado}
      PONTO_NOTAVEL: {rotulo: Ponte, entroncamento ou elevacao}
      QUADRICULA:    {rotulo: Quadricula da carta militar}


# =============================================================================
# ENTIDADES — as tabelas
# =============================================================================
# Cinco tabelas, e cada uma tem um proposito de uma frase:
#
#   EVENTO         onde todas as fontes convergem
#   ARQUIVO        manifesto do binario bruto (imagem, audio, PDF)
#   EXTRACAO       registro de cada inferencia de IA
#   REF_UNIDADE    hierarquia militar, para consulta
#   REF_GAZETTEER  nome de lugar -> coordenada, para consulta
# =============================================================================

entidades:

  # ---------------------------------------------------------------------------
  EVENTO:
    descricao: >-
      Fato relatado, observado ou ocorrido no terreno. Todas as fontes
      desembocam aqui, seja qual for a modalidade em que chegaram.
    abreviatura: EVT
    camada: silver
    chave: [EVENTO_IDT]
    campos:
      EVENTO_IDT:
        {tipo: string, nulo: false,
         descricao: "Identificador do evento. Calculado a partir da fonte, do identificador de origem e do instante, para que reprocessar o mesmo arquivo nao duplique linha."}
      SISTEMA_ORIGEM_COD:
        {tipo: string, nulo: false, dominio: sistema_origem,
         descricao: Sistema que produziu o dado.}
      REGISTRO_ORIGEM_COD:
        {tipo: string, nulo: false,
         descricao: Identificador do registro no sistema de origem.}
      MODALIDADE_ORIGEM_COD:
        {tipo: string, nulo: false, dominio: modalidade,
         descricao: "Forma em que o dado chegou. Sustenta a tese de heterogeneidade."}
      TIPO_COD:
        {tipo: string, nulo: false, dominio: tipo_evento, descricao: Natureza do fato.}
      FUNCAO_COMBATE_COD:
        {tipo: string, nulo: true, dominio: funcao_combate, descricao: Funcao de combate.}
      OCORRENCIA_DATA:
        {tipo: timestamp, nulo: false, descricao: Quando o fato ocorreu no terreno.}
      CHEGADA_DATA:
        {tipo: timestamp, nulo: false, descricao: Quando o registro entrou na plataforma.}
      LATENCIA_INGESTAO_SEGUNDOS:
        {tipo: double, nulo: true,
         descricao: "Diferenca entre as duas datas acima. SEGUNDOS e termo de representacao catalogado, por isso nao leva sufixo."}
      UNIDADE_REPORTANTE_COD:
        {tipo: string, nulo: true, referencia: REF_UNIDADE, descricao: Unidade que reportou.}
      GEOMETRIA_WKT:
        {tipo: string, nulo: true,
         descricao: "Onde foi, em Well-Known Text. E a coluna que quatro modalidades diferentes alimentam."}
      PRECISAO_METRO:
        {tipo: double, nulo: true,
         descricao: "Incerteza da localizacao. Sem sufixo porque METRO ja implica quantidade."}
      LOCALIZACAO_METODO_COD:
        {tipo: string, nulo: true, dominio: metodo_localizacao,
         descricao: "Como a posicao foi obtida. Explica a precisao."}
      PRIORIDADE_COD:
        {tipo: string, nulo: true, dominio: prioridade, descricao: Urgencia do tratamento.}
      FONTE_CONFIABILIDADE_COD:
        {tipo: string, nulo: true, dominio: confiabilidade, descricao: Confiabilidade da fonte.}
      INFO_CREDIBILIDADE_COD:
        {tipo: string, nulo: true, dominio: credibilidade,
         descricao: "Credibilidade da informacao. Chega junto com a confiabilidade num codigo unico de duas posicoes, separado na ingestao."}
      RELATO_TEXTO:
        {tipo: string, nulo: true,
         descricao: "Narrativa livre, quando houver. E a entrada da extracao por modelo de linguagem."}
      ARQUIVO_IDT:
        {tipo: string, nulo: true, referencia: ARQUIVO,
         descricao: "Arquivo bruto que originou o evento. Primeiro elo da rastreabilidade."}
      EXTRACAO_IDT:
        {tipo: string, nulo: true, referencia: EXTRACAO,
         descricao: "Inferencia que produziu o dado. Segundo elo: leva ate o modelo e a versao de prompt."}
      EXTRACAO_MODELO_NOME:
        {tipo: string, nulo: true,
         descricao: "Modelo que extraiu o dado, repetido aqui de proposito para que a consulta mostre a origem sem precisar de juncao."}

  # ---------------------------------------------------------------------------
  ARQUIVO:
    descricao: >-
      Manifesto de um arquivo bruto: imagem, audio ou documento. O binario fica
      no armazenamento de objetos; aqui ficam o endereco, o hash e o conteudo ja
      extraido.
    abreviatura: ARQ
    camada: bronze
    chave: [ARQUIVO_IDT]
    campos:
      ARQUIVO_IDT:       {tipo: string, nulo: false, descricao: Identificador do arquivo.}
      CONTEUDO_HASH_COD: {tipo: string, nulo: false, descricao: "Hash do conteudo. Da deduplicacao de graca: o mesmo arquivo reenviado nao gera linha nova."}
      ARQUIVO_URI_TXT:   {tipo: string, nulo: false, descricao: Endereco no armazenamento de objetos.}
      MIME_TIPO_COD:     {tipo: string, nulo: false, descricao: "Tipo do arquivo. Ex.: image/jpeg, audio/wav, application/pdf."}
      MODALIDADE_COD:    {tipo: string, nulo: false, dominio: modalidade, descricao: Modalidade do arquivo.}
      ARQUIVO_TAMANHO_QNT: {tipo: bigint, nulo: false, descricao: Tamanho em bytes.}
      CAPTURA_DATA:      {tipo: timestamp, nulo: true, descricao: "Instante da captura, lido do metadado tecnico do proprio arquivo."}
      CAPTURA_GEOMETRIA_WKT: {tipo: string, nulo: true, descricao: "Coordenada lida do metadado da foto. E uma fonte independente do que o operador digitou, o que permite confrontar as duas."}
      EXTRAIDO_TEXTO:    {tipo: string, nulo: true, descricao: "Texto obtido do arquivo, por leitura direta ou por reconhecimento optico."}
      DIGITALIZADO_IND:  {tipo: string, nulo: true, descricao: "S ou N. Se S, o texto veio de OCR e a qualidade e menor."}
      RECEBIMENTO_DATA:  {tipo: timestamp, nulo: false, descricao: Quando o arquivo chegou.}

  # ---------------------------------------------------------------------------
  EXTRACAO:
    descricao: >-
      Uma linha para cada inferencia de IA — reconhecimento optico, transcricao
      de audio ou modelo de linguagem. E esta tabela que permite responder "de
      onde veio este numero" quando o dado foi produzido por um modelo.
    abreviatura: EXTR
    camada: bronze
    chave: [EXTRACAO_IDT]
    campos:
      EXTRACAO_IDT:      {tipo: string, nulo: false, descricao: Identificador da inferencia.}
      ARQUIVO_IDT:       {tipo: string, nulo: false, referencia: ARQUIVO, descricao: Arquivo de entrada.}
      FERRAMENTA_NOME:   {tipo: string, nulo: false, descricao: "Ferramenta usada. Ex.: tesseract, faster-whisper, ollama."}
      MODELO_NOME:       {tipo: string, nulo: false, descricao: "Modelo usado. Ex.: qwen3.5:4b."}
      PROMPT_VERSAO_COD: {tipo: string, nulo: true, descricao: "Versao do prompt. Sem ela, a pergunta de auditoria fica sem resposta completa."}
      SAIDA_TEXTO:       {tipo: string, nulo: true, descricao: Saida da inferencia.}
      CONFIANCA_PCTL:    {tipo: double, nulo: true, descricao: "Confianca declarada pela ferramenta, de 0 a 1."}
      INFERENCIA_SEGUNDOS: {tipo: double, nulo: true, descricao: Tempo gasto na inferencia.}
      STATUS_COD:        {tipo: string, nulo: false, descricao: "OK, PARCIAL ou FALHA."}
      EXECUCAO_DATA:     {tipo: timestamp, nulo: false, descricao: Quando a inferencia rodou.}

  # ---------------------------------------------------------------------------
  REF_UNIDADE:
    descricao: >-
      Hierarquia de organizacoes militares. Tabela de consulta: converte o que
      vem escrito na origem no codigo da unidade.
    abreviatura: RUNI
    camada: silver
    chave: [UNIDADE_COD]
    seed: seeds/unidades.csv
    campos:
      UNIDADE_COD:   {tipo: string, nulo: false, descricao: Codigo da unidade.}
      UNIDADE_NOME:  {tipo: string, nulo: false, descricao: Designacao por extenso.}
      UNIDADE_SIGLA: {tipo: string, nulo: false, descricao: "Designacao abreviada, formada segundo o MD33-M-02."}
      ESCALAO_COD:   {tipo: string, nulo: false, dominio: escalao, descricao: Escalao da unidade.}
      SUPERIOR_COD:  {tipo: string, nulo: true, referencia: REF_UNIDADE, descricao: "Unidade imediatamente superior. Vazio so no topo."}

  # ---------------------------------------------------------------------------
  REF_GAZETTEER:
    descricao: >-
      Indice de nomes geograficos. Tabela de consulta: converte referencia
      textual em ponto. E o que permite uma mensagem de voz virar coordenada.
    abreviatura: RGAZ
    camada: silver
    chave: [LOCAL_COD]
    seed: seeds/gazetteer.csv
    campos:
      LOCAL_COD:        {tipo: string, nulo: false, descricao: Codigo do local.}
      LOCAL_NOME:       {tipo: string, nulo: false, descricao: Nome do local.}
      LOCAL_TIPO_COD:   {tipo: string, nulo: false, dominio: tipo_local, descricao: Natureza da referencia.}
      REFERENCIA_TEXTO: {tipo: string, nulo: false, descricao: "Forma textual usada para casar com a origem. Ex.: 'BR-154 km 43'."}
      GEOMETRIA_WKT:    {tipo: string, nulo: false, descricao: Ponto correspondente.}
      PRECISAO_METRO:   {tipo: double, nulo: true, descricao: "Incerteza da referencia: um marco de rodovia e mais preciso que o nome de um povoado."}


# =============================================================================
# FONTES — o de/para
# =============================================================================
# Cada bloco diz, para um sistema, como cada campo dele chega ao canonico.
#
# Transformacoes disponiveis (o codigo delas vive no job, nao aqui):
#   direto             copia o valor
#   json               extrai do payload JSON pelo caminho indicado
#   ts_iso / ts_br     texto -> data
#   ponto_de_latlon    par de numeros -> ponto
#   geojson_para_wkt   GeoJSON -> WKT
#   dms_para_ponto     grau-minuto-segundo em texto -> ponto
#   decametrica_para_ponto  coordenada metrica militar -> ponto
#   gazetteer          nome de lugar -> ponto, consultando REF_GAZETTEER
#   dominio            valor da origem -> valor canonico, pelos sinonimos
#   referencia         valor da origem -> codigo de uma tabela de consulta
#   constante          grava um valor fixo
#   split_escala       'B2' -> confiabilidade B e credibilidade 2 (um campo, dois destinos)
# =============================================================================

fontes:

  # --- SIM: os 8 tipos que ja existiam. JSON, sem IA. -------------------------
  SIM:
    modalidade: JSON
    origem_tabela: bronze.dados
    destino: EVENTO
    comum:
      batalhao_origem:   {campo: UNIDADE_REPORTANTE_COD, transformacao: direto}
      timestamp_geracao: {campo: OCORRENCIA_DATA, transformacao: direto}
      timestamp_chegada: {campo: CHEGADA_DATA, transformacao: direto}
      _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: SIM}
      _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: JSON}
      _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: GPS}
    tipos:
      gps:
        _tipo:      {campo: TIPO_COD, transformacao: constante, valor: POSICAO}
        _funcao:    {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: MOV_MANOBRA}
        id_veiculo: {campo: REGISTRO_ORIGEM_COD, transformacao: json, caminho: $.id_veiculo}
        _geometria: {campo: GEOMETRIA_WKT, transformacao: ponto_de_latlon,
                     caminho_lat: $.latitude, caminho_lon: $.longitude}
      sensor:
        _tipo:     {campo: TIPO_COD, transformacao: constante, valor: SENSOR}
        _funcao:   {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: INTELIGENCIA}
        id_sensor: {campo: REGISTRO_ORIGEM_COD, transformacao: json, caminho: $.id_sensor}
        _geometria: {campo: GEOMETRIA_WKT, transformacao: ponto_de_latlon,
                     caminho_lat: $.latitude_centro, caminho_lon: $.longitude_centro}
      relt_intel:
        _tipo:        {campo: TIPO_COD, transformacao: constante, valor: AVISTAMENTO_INIMIGO}
        _funcao:      {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: INTELIGENCIA}
        id_relatorio: {campo: REGISTRO_ORIGEM_COD, transformacao: json, caminho: $.id_relatorio}
        descricao:    {campo: RELATO_TEXTO, transformacao: json, caminho: $.descricao}
        confiabilidade:
          campo: [FONTE_CONFIABILIDADE_COD, INFO_CREDIBILIDADE_COD]
          transformacao: split_escala
          caminho: $.confiabilidade
          observacao: "o gerador produz 'A1', 'B2', 'C3' — um campo de origem, dois canonicos"
        _geometria: {campo: GEOMETRIA_WKT, transformacao: ponto_de_latlon,
                     caminho_lat: $.coordenada_lat, caminho_lon: $.coordenada_lon}
      paf:
        _tipo:      {campo: TIPO_COD, transformacao: constante, valor: MISSAO_TIRO}
        _funcao:    {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: FOGOS}
        id_paf:     {campo: REGISTRO_ORIGEM_COD, transformacao: json, caminho: $.id_paf}
        prioridade: {campo: PRIORIDADE_COD, transformacao: dominio, dominio: prioridade, caminho: $.prioridade}
        _geometria: {campo: GEOMETRIA_WKT, transformacao: ponto_de_latlon,
                     caminho_lat: $.coordenada_alvo_lat, caminho_lon: $.coordenada_alvo_lon}
      obstaculo:
        _tipo:        {campo: TIPO_COD, transformacao: constante, valor: OBSTACULO}
        _funcao:      {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: MOV_MANOBRA}
        id_obstaculo: {campo: REGISTRO_ORIGEM_COD, transformacao: json, caminho: $.id_obstaculo}
        _geometria:   {campo: GEOMETRIA_WKT, transformacao: ponto_de_latlon,
                       caminho_lat: $.coordenada_lat, caminho_lon: $.coordenada_lon}
      seg_area:
        _tipo:   {campo: TIPO_COD, transformacao: constante, valor: INCIDENTE}
        _funcao: {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: PROTECAO}
        id_ocorrencia: {campo: REGISTRO_ORIGEM_COD, transformacao: json, caminho: $.id_ocorrencia}
        _geometria:    {campo: GEOMETRIA_WKT, transformacao: ponto_de_latlon,
                        caminho_lat: $.coordenada_lat, caminho_lon: $.coordenada_lon}
      pessoal:
        _tipo:       {campo: TIPO_COD, transformacao: constante, valor: SITUACAO_PESSOAL}
        _funcao:     {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: LOGISTICA}
        id_relatorio: {campo: REGISTRO_ORIGEM_COD, transformacao: json, caminho: $.id_relatorio}
      material:
        _tipo:       {campo: TIPO_COD, transformacao: constante, valor: SITUACAO_MEIO}
        _funcao:     {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: LOGISTICA}
        id_viatura: {campo: REGISTRO_ORIGEM_COD, transformacao: json, caminho: $.id_viatura}

  # --- C2_A: JSON com geometria nativa. ---------------------------------------
  C2_A:
    modalidade: JSON
    destino: EVENTO
    entidades:
      posicao:
        campos:
          id:          {campo: REGISTRO_ORIGEM_COD, transformacao: direto}
          hora:        {campo: OCORRENCIA_DATA, transformacao: ts_iso}
          fracao:      {campo: UNIDADE_REPORTANTE_COD, transformacao: referencia, referencia: REF_UNIDADE}
          coordenadas: {campo: GEOMETRIA_WKT, transformacao: geojson_para_wkt}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: C2_A}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: JSON}
          _tipo:       {campo: TIPO_COD, transformacao: constante, valor: POSICAO}

  # --- C2_B: texto livre e incidente com foto. --------------------------------
  C2_B:
    destino: EVENTO
    entidades:

      relato:
        modalidade: TEXTO
        campos:
          data:        {campo: OCORRENCIA_DATA, transformacao: ts_br, formato: "dd/MM/yyyy HH:mm:ss"}
          relator:     {campo: UNIDADE_REPORTANTE_COD, transformacao: referencia, referencia: REF_UNIDADE}
          localizacao: {campo: GEOMETRIA_WKT, transformacao: dms_para_ponto,
                        observacao: "'Sem localizacao' vira vazio, e nao erro: relato sem coordenada e caso legitimo."}
          situacao:    {campo: RELATO_TEXTO, transformacao: direto}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: C2_B}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: TEXTO}
          _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: MANUAL}
        # Estes NAO vem da origem: sao inferidos pelo modelo de linguagem a
        # partir de RELATO_TEXTO. Cada inferencia gera uma linha em EXTRACAO.
        extraidos_por_llm: [TIPO_COD, FUNCAO_COMBATE_COD, PRIORIDADE_COD]

      incidente:
        modalidade: IMAGEM
        campos:
          id:          {campo: REGISTRO_ORIGEM_COD, transformacao: direto}
          prioridade:  {campo: PRIORIDADE_COD, transformacao: dominio, dominio: prioridade}
          c_op:        {campo: UNIDADE_REPORTANTE_COD, transformacao: referencia, referencia: REF_UNIDADE}
          foto:        {campo: ARQUIVO_IDT, transformacao: referencia, referencia: ARQUIVO}
          _geometria:  {campo: GEOMETRIA_WKT, transformacao: referencia,
                        referencia: ARQUIVO.CAPTURA_GEOMETRIA_WKT,
                        observacao: "vem do metadado da foto, nao do que o operador digitou"}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: C2_B}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: IMAGEM}
          _tipo:       {campo: TIPO_COD, transformacao: constante, valor: INCIDENTE}
          _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: GPS}

  # --- FOGOS: Relatorio de Bombardeio, PDF digitalizado. OCR + LLM. -----------
  FOGOS:
    modalidade: PDF
    destino: EVENTO
    entidades:
      relatorio_bombardeio:
        campos:
          col_A:       {campo: REGISTRO_ORIGEM_COD, transformacao: direto, observacao: numero do alvo}
          col_B:       {campo: GEOMETRIA_WKT, transformacao: decametrica_para_ponto,
                        observacao: "'03250-10550' -> coordenada metrica"}
          col_G:       {campo: RELATO_TEXTO, transformacao: direto, observacao: "armamento observado, ex. '2/Ob/Me'"}
          confiabilidade: {campo: FONTE_CONFIABILIDADE_COD, transformacao: dominio, dominio: confiabilidade}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: FOGOS}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: PDF}
          _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: OCR_COORD}
          _funcao:     {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: FOGOS}
          _tipo:       {campo: TIPO_COD, transformacao: constante, valor: MISSAO_TIRO}
        extraidos_por_llm: [OCORRENCIA_DATA, PRIORIDADE_COD]

  # --- VOZ: audio de radio. A cadeia mais longa: wav -> texto -> dado. --------
  VOZ:
    modalidade: AUDIO
    destino: EVENTO
    entidades:
      transcricao:
        campos:
          texto:    {campo: RELATO_TEXTO, transformacao: direto, observacao: saida do reconhecimento de fala}
          codinome: {campo: TIPO_COD, transformacao: dominio, dominio: tipo_evento,
                     observacao: "'cavalo' casa com o sinonimo de AVISTAMENTO_INIMIGO"}
          referencia_local: {campo: GEOMETRIA_WKT, transformacao: gazetteer,
                             referencia: REF_GAZETTEER,
                             observacao: "'BR-154 km 43' -> ponto. Nao converte: consulta."}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: VOZ}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: AUDIO}
          _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: GAZETTEER}
        extraidos_por_llm: [OCORRENCIA_DATA, PRIORIDADE_COD, FUNCAO_COMBATE_COD]


# =============================================================================
# PARA AUMENTAR O ESCOPO
# =============================================================================
# O recorte atual gera um documento de fogos: o Relatorio de Bombardeio. Os
# demais anexos do manual de artilharia (Folha de Trabalho do S-2, Lista de
# Alvos, Arquivo Historico, Lista de Armas Inimigas) provam a mesma coisa do
# ponto de vista das teses — documento tabular que exige OCR — e por isso nao
# sao gerados.
#
# Se for preciso incluir um deles:
#   1. acrescentar um bloco em `fontes`, no molde de FOGOS acima;
#   2. acrescentar o gerador correspondente em scripts/geradores/.
# Nenhum job e alterado, nenhuma tabela e recriada.
# =============================================================================
