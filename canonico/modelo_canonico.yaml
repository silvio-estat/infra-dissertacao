  REF_GAZETTEER:
    descricao: >-
      Indice de nomes geograficos. Tabela de consulta: converte referencia
      textual em ponto. E o que permite uma mensagem de voz virar coordenada.
    abreviatura: RGAZ
    camada: silver
    chave: [LOCAL_COD]
    seed: seeds/gazetteer.csv
    campos:
      LOCAL_COD:        {tipo: string, nulo: false, descricao: Codigo do local.}
      LOCAL_NOME:       {tipo: string, nulo: false, descricao: Nome do local.}
      LOCAL_TIPO_COD:   {tipo: string, nulo: false, dominio: tipo_local, descricao: Natureza da referencia.}
      REFERENCIA_TXT:   {tipo: string, nulo: false, descricao: "Forma textual usada para casar com a origem. Ex.: 'BR-154 km 43'."}
      GEOMETRIA_WKT:    {tipo: string, nulo: false, descricao: Ponto correspondente.}
      PRECISAO_METRO:   {tipo: double, nulo: true, descricao: "Incerteza da referencia: um marco de rodovia e mais preciso que o nome de um povoado."}

  # ---------------------------------------------------------------------------
  REF_ABREVIATURA:
    descricao: >-
      Dicionario de abreviaturas do MD33-M-02. Tabela de consulta: converte o
      que foi digitado na celula no termo canonico.

      Entra na versao 3 porque o problema real do formulario decretado nao esta
      no cabecalho — esse o EM fixa, e ninguem redigita cabecalho de planilha
      pronta — e sim no PREENCHIMENTO: uma OM escreve Fuzil, outra escreve Fz.
      E o dicionario mostra que o caso e pior do que variacao ortografica:

          Fz   -> Fuzil       (a arma)
          Fuz  -> Fuzileiro   (a pessoa)

      A OM que escreve Fuz querendo dizer Fuzil comete erro semantico — material
      vira pessoal. Uma coluna de texto livre engole isso em silencio. E o mesmo
      fenomeno do Nr contra NR que motivou a regra das duas grafias, agora no
      conteudo da celula em vez do nome da coluna.

      Com o dicionario como tabela, a resolucao vira declarativa (transformacao
      `abreviatura`) e o que NAO resolve fica mensuravel em vez de virar nulo
      calado. Indicador que sai de graca: percentual de celulas resolvidas pelo
      manual, percentual resolvidas por inferencia, percentual nao resolvidas.
    abreviatura: RABV
    camada: silver
    chave: [ABREVIATURA_COD]
    seed: ir_14_06/abreviaturas_md33.csv
    campos:
      ABREVIATURA_COD:  {tipo: string, nulo: false, descricao: "Abreviatura como o MD33-M-02 a grafa. Ex.: 'Vtr', 'Ef', 'Fz'."}
      TERMO_NOME:       {tipo: string, nulo: false, descricao: "Termo por extenso. Ex.: 'Viatura', 'Efetivo', 'Fuzil'."}
      SINONIMO_TXT:     {tipo: string, nulo: true, descricao: Outras grafias aceitas para o mesmo termo.}
      ORIGEM_COD:       {tipo: string, nulo: true, descricao: "Procedencia da abreviatura: capitulo do MD33-M-02 ou proposta a catalogar."}


# =============================================================================
# FONTES — o de/para
# =============================================================================
# Cada bloco diz, para um sistema, como cada campo dele chega ao canonico.
#
# Transformacoes disponiveis (o codigo delas vive no job, nao aqui):
#   direto             copia o valor
#   json               extrai pelo caminho indicado do payload JSON, que fica
#                      preservado em RECEPCAO_BRUTA.CONTEUDO_JSON_TXT
#   celula             le uma celula da planilha pelo cabecalho decretado, a
#                      partir de EXTRACAO.SAIDA_TXT (a leitura direta e uma
#                      extracao sem inferencia)
#   ts_iso / ts_br     texto -> data
#   ponto_de_latlon    par de numeros -> ponto
#   geojson_para_wkt   GeoJSON -> WKT
#   dms_para_ponto     grau-minuto-segundo em texto -> ponto
#   decametrica_para_ponto  coordenada metrica militar -> ponto
#   gazetteer          nome de lugar -> ponto, consultando REF_GAZETTEER
#   abreviatura        abreviatura digitada -> termo, consultando REF_ABREVIATURA
#   dominio            valor da origem -> valor canonico, pelos sinonimos
#   referencia         valor da origem -> codigo de uma tabela de consulta
#   contexto_operacao  hora e ponto de captura -> OPERACAO_COD, pela janela e
#                      AREA_WKT de REF_OPERACAO (fallback para arquivo sem identificacao)
#   constante          grava um valor fixo
#   derivado           calculado por regra declarada no campo de destino
#   split_escala       'B2' -> confiabilidade B e credibilidade 2 (um campo, dois destinos)
#   sobra              tudo que o formulario nao previa -> uma coluna JSON
#
# SIDECAR: nenhum arquivo se descreve bem. TODA midia em landing/ — xlsx, PDF,
# imagem, audio — vem com um JSON ao lado (mesmo nome, extensao .json) com a
# proveniencia: operacao, unidade remetente, hora, geo e — para audio — a rede
# radio. O sidecar entra em RECEPCAO_BRUTA como qualquer registro estruturado;
# o binario entra em ARQUIVO; os dois se ligam por ARQUIVO_IDT. O bloco da fonte
# declara o sidecar em `sidecar:` e mapeia os campos dele como mapearia um JSON.
# O CONTEUDO do arquivo (celulas, colunas) vem do binario por EXTRACAO — leitura
# direta ou OCR, sempre registrada — e o sidecar so carrega o que e ABOUT o
# arquivo.
# =============================================================================

fontes:

  # --- C2_A: JSON com geometria nativa. Sem IA. -------------------------------
  # Absorve o `gps` e o `obstaculo` da fonte SIM removida — e ganha com isso:
  # geometria nativa em vez de par de numeros solto, e fracao resolvida contra
  # REF_UNIDADE em vez de sigla de batalhao em texto livre.
  #
  # O payload cai primeiro em RECEPCAO_BRUTA (1 linha por registro, JSON cru
  # inteiro); as transformacoes `json` abaixo leem de la, nao da landing/. O
  # campo `_recepcao` grava o elo de linhagem em EVENTO.RECEPCAO_IDT.
  C2_A:
    modalidade: JSON
    bronze: RECEPCAO_BRUTA
    destino: EVENTO
    entidades:

      posicao:
        campos:
          id:          {campo: REGISTRO_ORIGEM_COD, transformacao: direto}
          hora:        {campo: OCORRENCIA_DATA, transformacao: ts_iso}
          fracao:      {campo: UNIDADE_REPORTANTE_COD, transformacao: referencia, referencia: REF_UNIDADE,
                        observacao: "sigla, como o C2_A exporta ('2o Pel Fuz/1a Cia Fuz/511o Btl Inf Mtz'); casa com REF_UNIDADE.UNIDADE_SIGLA"}
          coordenadas: {campo: GEOMETRIA_WKT, transformacao: geojson_para_wkt}
          operacao:    {campo: OPERACAO_COD, transformacao: referencia, referencia: REF_OPERACAO,
                        observacao: "o C2_A manda o hash da operacao; casa com REF_OPERACAO.OPERACAO_ORIGEM_C2A_COD"}
          _recepcao:   {campo: RECEPCAO_IDT, transformacao: referencia, referencia: RECEPCAO_BRUTA}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: C2_A}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: JSON}
          _tipo:       {campo: TIPO_COD, transformacao: constante, valor: POSICAO}
          _funcao:     {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: MOV_MANOBRA}
          _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: GPS}
          _c2:         {campo: FUNCAO_C2_INDIC, transformacao: derivado}

      # Medida de Coordenacao e Controle: ponto, linha, poligono ou desenho a
      # mao livre. E aqui que o antigo `obstaculo` passa a viver, e melhora —
      # obstaculo e feicao grafica no mapa, nao ponto.
      mcc:
        campos:
          id:          {campo: REGISTRO_ORIGEM_COD, transformacao: direto}
          hora:        {campo: OCORRENCIA_DATA, transformacao: ts_iso}
          fracao:      {campo: UNIDADE_REPORTANTE_COD, transformacao: referencia, referencia: REF_UNIDADE,
                        observacao: "sigla; casa com REF_UNIDADE.UNIDADE_SIGLA"}
          geometria:   {campo: GEOMETRIA_WKT, transformacao: geojson_para_wkt,
                        observacao: "ponto, LINESTRING ou POLYGON; o desenho a mao livre e uma LINESTRING de muitos vertices"}
          especie:     {campo: TIPO_COD, transformacao: dominio, dominio: tipo_evento,
                        observacao: "'campo de minas' -> OBSTACULO; 'linha de fase' -> MCC. A especie decide o tipo E a funcao (regra de _funcao)."}
          operacao:    {campo: OPERACAO_COD, transformacao: referencia, referencia: REF_OPERACAO,
                        observacao: "hash da operacao; casa com REF_OPERACAO.OPERACAO_ORIGEM_C2A_COD"}
          _recepcao:   {campo: RECEPCAO_IDT, transformacao: referencia, referencia: RECEPCAO_BRUTA}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: C2_A}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: JSON}
          _funcao:     {campo: FUNCAO_COMBATE_COD, transformacao: derivado,
                        regra: "PROTECAO quando TIPO_COD = OBSTACULO; MOV_MANOBRA quando TIPO_COD = MCC"}
          _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: MANUAL}
          _c2:         {campo: FUNCAO_C2_INDIC, transformacao: derivado}

  # --- C2_B: texto livre e incidente com foto. --------------------------------
  # Absorve o `relt_intel` e o `seg_area` da fonte SIM. O seg_area era duplicata
  # literal do incidente daqui, so que empobrecida — sem foto e sem prioridade.
  #
  # O C2_B exporta JSON: cada relato e cada incidente e um registro que cai
  # primeiro em RECEPCAO_BRUTA. O incidente, alem disso, referencia um arquivo
  # de imagem — que gera uma linha em ARQUIVO. E o caso das duas formas de
  # Bronze na mesma fonte: o registro na RECEPCAO_BRUTA, a foto no ARQUIVO. O
  # registro JSON do incidente FAZ o papel de sidecar da foto: carrega a
  # operacao, a unidade e a hora que a imagem sozinha nao carrega de forma
  # confiavel. A operacao e campo nativo do JSON (no faz de conta, o gerador a
  # inclui — o C2_B nao a tinha).
  C2_B:
    bronze: RECEPCAO_BRUTA
    destino: EVENTO
    entidades:

      relato:
        modalidade: TEXTO
        campos:
          id:          {campo: REGISTRO_ORIGEM_COD, transformacao: direto}
          data:        {campo: OCORRENCIA_DATA, transformacao: ts_br, formato: "dd/MM/yyyy HH:mm:ss"}
          relator:     {campo: UNIDADE_REPORTANTE_COD, transformacao: referencia, referencia: REF_UNIDADE,
                        observacao: "'<posto> <funcao> <fracao> - <IDENTIDADE_MIL>'; a fracao casa com REF_UNIDADE.UNIDADE_SIGLA"}
          localizacao: {campo: GEOMETRIA_WKT, transformacao: dms_para_ponto,
                        observacao: "'Sem localizacao' vira vazio, e nao erro: relato sem coordenada e caso legitimo."}
          situacao:    {campo: RELATO_TXT, transformacao: direto}
          operacao:    {campo: OPERACAO_COD, transformacao: referencia, referencia: REF_OPERACAO,
                        observacao: "campo nativo do JSON do C2_B (no faz de conta, o gerador o inclui)"}
          _recepcao:   {campo: RECEPCAO_IDT, transformacao: referencia, referencia: RECEPCAO_BRUTA}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: C2_B}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: TEXTO}
          _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: MANUAL}
          _c2:         {campo: FUNCAO_C2_INDIC, transformacao: derivado}
        # Estes NAO vem da origem: sao inferidos pelo modelo de linguagem a
        # partir de RELATO_TXT. Cada inferencia gera uma linha em EXTRACAO.
        # A confiabilidade entrou aqui porque o antigo relt_intel a trazia
        # pronta ('A1'); num relato livre de verdade ela e juizo do analista,
        # e portanto inferida.
        extraidos_por_llm: [TIPO_COD, FUNCAO_COMBATE_COD, PRIORIDADE_COD,
                            FONTE_CONFIABILIDADE_COD, INFO_CREDIBILIDADE_COD]

      incidente:
        modalidade: IMAGEM
        sidecar: "o proprio registro JSON do incidente acompanha a foto (mesmo nome, .json)"
        campos:
          id:          {campo: REGISTRO_ORIGEM_COD, transformacao: direto}
          data_hora:   {campo: OCORRENCIA_DATA, transformacao: ts_br, formato: "dd/MM/yyyy HH:mm:ss"}
          descricao:   {campo: RELATO_TXT, transformacao: direto, observacao: "texto curto do incidente, como o operador digitou"}
          prioridade:  {campo: PRIORIDADE_COD, transformacao: dominio, dominio: prioridade}
          c_op:        {campo: UNIDADE_REPORTANTE_COD, transformacao: referencia, referencia: REF_UNIDADE}
          operacao:    {campo: OPERACAO_COD, transformacao: referencia, referencia: REF_OPERACAO,
                        observacao: "do sidecar; confere contra ARQUIVO.OPERACAO_COD (o palpite da pasta)"}
          foto:        {campo: ARQUIVO_IDT, transformacao: referencia, referencia: ARQUIVO}
          _geometria:  {campo: GEOMETRIA_WKT, transformacao: referencia,
                        referencia: ARQUIVO.CAPTURA_GEOMETRIA_WKT,
                        observacao: "vem do metadado da foto, nao do que o operador digitou"}
          _recepcao:   {campo: RECEPCAO_IDT, transformacao: referencia, referencia: RECEPCAO_BRUTA,
                        observacao: "o registro JSON do incidente (o sidecar); a foto em si vai para ARQUIVO pelo campo foto"}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: C2_B}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: IMAGEM}
          _tipo:       {campo: TIPO_COD, transformacao: constante, valor: INCIDENTE}
          _funcao:     {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: PROTECAO}
          _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: GPS}
          _c2:         {campo: FUNCAO_C2_INDIC, transformacao: derivado}

  # --- RELPER: o formulario decretado pelo EM da brigada. ---------------------
  # Absorve o `pessoal` e o `material` da fonte SIM, e traz a sexta modalidade.
  #
  # Duas entidades para a MESMA remessa, porque as duas acontecem no campo:
  # a OM que tem o arquivo devolve o xlsx; a que nao tem imprime, preenche a
  # mao, assina e digitaliza. Mesmo formulario, duas modalidades, e a segunda
  # atravessa OCR antes de chegar aos mesmos numeros.
  #
  # O xlsx chega com um sidecar .json (quem remeteu, qual operacao, data e
  # turno da remessa) — o que e ABOUT o arquivo. As celulas da tabela, que sao
  # o CONTEUDO, continuam vindo do binario por `celula`.
  RELPER:
    bronze: RECEPCAO_BRUTA
    destino: EVENTO
    extensao: SITUACAO_UNIDADE
    cadencia: "duas remessas por dia, fixadas pelo EM da brigada"
    granularidade: >-
      Uma linha da planilha por subunidade. Um arquivo produz N eventos e N
      linhas de SITUACAO_UNIDADE, todos apontando para o mesmo ARQUIVO_IDT e o
      mesmo RECEPCAO_IDT (o sidecar).
    entidades:

      situacao:
        modalidade: PLANILHA
        sidecar:
          operacao:      {campo: OPERACAO_COD, transformacao: referencia, referencia: REF_OPERACAO,
                          observacao: "confere contra ARQUIVO.OPERACAO_COD (a pasta em landing/)"}
          om_remetente:  {campo: REGISTRO_ORIGEM_COD, transformacao: derivado,
                          observacao: "a OM que remeteu o arquivo (sigla). Nao tem coluna propria: entra na regra de _registro. A unidade de CADA LINHA vem da celula 'fracao'."}
          data_hora:     {campo: OCORRENCIA_DATA, transformacao: ts_iso}
          turno:         {campo: TURNO_COD, transformacao: dominio, dominio: turno_relatorio}
        campos:
          _registro:   {campo: REGISTRO_ORIGEM_COD, transformacao: derivado,
                        regra: "sidecar (OM remetente + data + turno) + celula (unidade da linha)"}
          fracao:      {campo: UNIDADE_REPORTANTE_COD, transformacao: referencia, referencia: REF_UNIDADE,
                        observacao: "celula preenchida a mao: '1a Cia', '1 Cia Fuz', '1ª Cia'. Resolve contra REF_UNIDADE, e o que nao casar e reportado, nao descartado."}
          arquivo:     {campo: ARQUIVO_IDT, transformacao: referencia, referencia: ARQUIVO}
          _recepcao:   {campo: RECEPCAO_IDT, transformacao: referencia, referencia: RECEPCAO_BRUTA}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: RELPER}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: PLANILHA}
          _tipo:       {campo: TIPO_COD, transformacao: constante, valor: SITUACAO_UNIDADE}
          _funcao:     {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: LOGISTICA}
          _c2:         {campo: FUNCAO_C2_INDIC, transformacao: derivado,
                        observacao: "resolve para N: o formulario e remetido ao repositorio, nao produzido dentro de um sistema de C2"}
        # As colunas decretadas pelo EM, que vao para a extensao.
        # `celula` le pelo cabecalho fixado no formulario.
        extensao:
          Ef Prev:      {campo: EF_PREVISTO_QNT, transformacao: celula}
          Ef Pres:      {campo: EF_PRESENTE_QNT, transformacao: celula}
          Baixas Cmb:   {campo: BAIXA_COMBATE_QNT, transformacao: celula}
          Baixas N Cmb: {campo: BAIXA_NAO_COMBATE_QNT, transformacao: celula}
          Evacuados:    {campo: EVACUADO_QNT, transformacao: celula}
          Vtr Op:       {campo: VTR_OPERACIONAL_QNT, transformacao: celula}
          Vtr Total:    {campo: VTR_TOTAL_QNT, transformacao: celula}
          Comb Pctl:    {campo: COMBUSTIVEL_PCTL, transformacao: celula}
          Sup Cl I:     {campo: SUP_CL_I_DIAS, transformacao: celula}
          Sup Cl III:   {campo: SUP_CL_III_DIAS, transformacao: celula}
          Sup Cl V:     {campo: SUP_CL_V_DIAS, transformacao: celula}
          Sup Cl VIII:  {campo: SUP_CL_VIII_DIAS, transformacao: celula}
          Nec Prio:     {campo: NECESSIDADE_TXT, transformacao: abreviatura,
                         referencia: REF_ABREVIATURA,
                         observacao: "'Fz' -> Fuzil (a arma), 'Fuz' -> Fuzileiro (a pessoa). A OM que troca uma pela outra comete erro semantico, nao ortografico: material vira pessoal. Coluna de texto livre engoliria isso em silencio."}
          _versao:      {campo: FORMULARIO_VERSAO_COD, transformacao: derivado,
                         regra: "identificada pelo conjunto de cabecalhos presentes na planilha"}
          _sobra:       {campo: ATRIBUTO_EXTRA_TXT, transformacao: sobra,
                         observacao: "toda coluna que o formulario nao previa, com o nome que a OM deu"}

      # Mesma remessa, impressa e digitalizada. Cruza duas modalidades numa
      # fonte so, e e o caso mais realista que existe: a OM que nao tem o
      # arquivo imprime, preenche, assina e fotografa.
      situacao_digitalizada:
        modalidade: PDF
        herda: situacao
        campos:
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: PDF}
          _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: OCR_COORD}
        extraidos_por_llm: [UNIDADE_REPORTANTE_COD]
        observacao: >-
          Herda o sidecar da irma: a operacao, a data e o turno vem do .json,
          iguais nas duas. So o CONTEUDO muda de caminho: as duas geram linha em
          EXTRACAO, a irma por leitura direta (openpyxl, INFERENCIA_INDIC = N) e
          esta por OCR (INFERENCIA_INDIC = S) antes de virar celula. Comparar as
          duas sobre o mesmo formulario daria a taxa de erro do OCR contra o
          valor verdadeiro — nao se calcula (decisao de 2026-09-10), mas fica
          disponivel.

  # --- FOGOS: Relatorio de Bombardeio (Anexo I do EB60-ME-12.301). PDF, OCR + LLM.
  # Absorve o `paf` da fonte SIM, que era duplicata empobrecida disto.
  #
  # O documento e gerado FIEL ao Anexo I: cabecalho (Rcb por / Do / Hora / Nr)
  # e as tres partes — 1a Informes de Observadores e Analise de Crateras
  # (colunas A a L), 2a Outras Fontes (M a R), 3a Execucao do Tiro (S a V).
  # So a 1a parte vira evento: cada linha e um informe de observador sobre
  # bombardeio INIMIGO, que e o que o relatorio existe para registrar. A 2a e a
  # 3a partes ficam no PDF e em EXTRACAO.SAIDA_TXT, mapeaveis depois (ver
  # "PARA AUMENTAR O ESCOPO").
  #
  # A avaliacao 'B2' NAO existe no Anexo I: saiu daqui e mora na fonte INTEL,
  # que e o documento que a carrega de fato.
  #
  # O PDF chega com sidecar .json (operacao, quem produziu, hora); as linhas
  # continuam vindo por OCR. O Anexo I e escaneado desde a origem — o S-2
  # preenche o formulario impresso e digitaliza — e por isso forca o OCR.
  FOGOS:
    modalidade: PDF
    bronze: RECEPCAO_BRUTA
    destino: EVENTO
    entidades:
      relatorio_bombardeio:
        sidecar:
          operacao:  {campo: OPERACAO_COD, transformacao: referencia, referencia: REF_OPERACAO}
          origem:    {campo: UNIDADE_REPORTANTE_COD, transformacao: referencia, referencia: REF_UNIDADE,
                      observacao: "quem produziu o relatorio: o S-2 do GAC (cabecalho 'Do:')"}
        campos:
          _registro:   {campo: REGISTRO_ORIGEM_COD, transformacao: derivado,
                        regra: "Nr do relatorio (cabecalho) + col_A",
                        observacao: "col_A e 'Informe de / Hora' (nota 1 do Anexo I): codinome do observador + grupo data-hora, ex. 'TROVAO 1 / 210900 NOV 16'"}
          col_F:       {campo: GEOMETRIA_WKT, transformacao: decametrica_para_ponto,
                        observacao: "'Area Bombardeada' (nota 5), ex. '06700-13150': e ONDE o fato ocorreu. A col_B e a posicao do OBSERVADOR (nota 2), nao do evento — fica em EXTRACAO.SAIDA_TXT, sem coluna canonica."}
          _relato:     {campo: RELATO_TXT, transformacao: derivado,
                        regra: "colunas G a L da linha, concatenadas",
                        observacao: "armamento inimigo (ex. '2/Ob/Me' = 2 obuses medios, nota 6), classificacao do tiro (Ntz, Dest, Itd..., nota 7), municao (nota 8), tempo clarao-som em segundos, efeito dos fogos (nota 9)"}
          arquivo:     {campo: ARQUIVO_IDT, transformacao: referencia, referencia: ARQUIVO}
          _recepcao:   {campo: RECEPCAO_IDT, transformacao: referencia, referencia: RECEPCAO_BRUTA}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: FOGOS}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: PDF}
          _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: OCR_COORD}
          _funcao:     {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: FOGOS}
          _tipo:       {campo: TIPO_COD, transformacao: constante, valor: BOMBARDEIO_INIMIGO}
          _c2:         {campo: FUNCAO_C2_INDIC, transformacao: derivado}
        extraidos_por_llm: [OCORRENCIA_DATA, PRIORIDADE_COD]
        observacao: >-
          OCORRENCIA_DATA: dia do grupo data-hora da col_A com a hora de inicio
          da col_D ('Hora da Atividade, De'). PRIORIDADE_COD: juizo do modelo a
          partir do efeito (col_L): danos e baixas -> URGENTE. A IA aponta, com
          modelo e prompt registrados em EXTRACAO; a conferencia e do
          estado-maior.

  # --- INTEL: Informe de inteligencia. PDF assinado e digitalizado, OCR + LLM. --
  # E o documento que carrega a avaliacao de fonte e informacao ('B2'): a letra
  # e a confiabilidade da fonte, o algarismo a credibilidade da informacao.
  # Chega assinado, por isso e PDF. Cabecalho fixo (Nr, grupo data-hora, origem,
  # assunto, avaliacao) e corpo em texto livre — a segunda fonte em que o modelo
  # de linguagem le prosa, desta vez saida de OCR, e nao do JSON do C2_B.
  # O contraste com o C2_B e proposital: la a confiabilidade e INFERIDA do
  # relato; aqui e LIDA do cabecalho, porque o analista ja a atribuiu.
  INTEL:
    modalidade: PDF
    bronze: RECEPCAO_BRUTA
    destino: EVENTO
    entidades:
      informe:
        sidecar:
          operacao:  {campo: OPERACAO_COD, transformacao: referencia, referencia: REF_OPERACAO}
          origem:    {campo: UNIDADE_REPORTANTE_COD, transformacao: referencia, referencia: REF_UNIDADE,
                      observacao: "secao de inteligencia que expediu o informe: E-2 da brigada ou S-2 da OM"}
        campos:
          nr:          {campo: REGISTRO_ORIGEM_COD, transformacao: direto, observacao: "numero do informe, do cabecalho"}
          avaliacao:   {campo: [FONTE_CONFIABILIDADE_COD, INFO_CREDIBILIDADE_COD],
                        transformacao: split_escala,
                        observacao: "um campo de origem, dois canonicos: 'B2' -> fonte B, credibilidade 2. Lido do cabecalho por OCR."}
          texto:       {campo: RELATO_TXT, transformacao: direto, observacao: "corpo do informe, saida do OCR"}
          referencia_local: {campo: GEOMETRIA_WKT, transformacao: gazetteer,
                             referencia: REF_GAZETTEER,
                             observacao: "o lugar citado no texto ('Ponte sobre o Corrego Aroeira') -> ponto. O modelo extrai a referencia; a tabela resolve. Sem lugar citado, vazio."}
          arquivo:     {campo: ARQUIVO_IDT, transformacao: referencia, referencia: ARQUIVO}
          _recepcao:   {campo: RECEPCAO_IDT, transformacao: referencia, referencia: RECEPCAO_BRUTA}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: INTEL}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: PDF}
          _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: GAZETTEER}
          _funcao:     {campo: FUNCAO_COMBATE_COD, transformacao: constante, valor: INTELIGENCIA}
          _c2:         {campo: FUNCAO_C2_INDIC, transformacao: derivado,
                        observacao: "resolve para N: documento avulso, nao produzido dentro de sistema de C2"}
        extraidos_por_llm: [OCORRENCIA_DATA, TIPO_COD, PRIORIDADE_COD]

  # --- VOZ: audio de radio. A cadeia mais longa: wav -> texto -> dado. --------
  # O .wav nao se descreve. Vem com um SIDECAR .json do gravador de radio (voice
  # logger): o gravador nao transcreve, mas SEMPRE carimba a hora da
  # transmissao, a estacao de origem (a unidade dona do radio, como cadastrada
  # no gravador) e — num exercicio — a operacao. Tres campos, de proposito: e o
  # minimo que da contexto ao audio. O sidecar entra em RECEPCAO_BRUTA; o .wav,
  # em ARQUIVO; a operacao sai do sidecar, o conteudo sai da transcricao + LLM.
  # A fala e normal, em portugues claro, com os codinomes no lugar dos termos
  # sensiveis: "cavalo passando proximo a ponte do corrego Aroeira".
  VOZ:
    modalidade: AUDIO
    bronze: RECEPCAO_BRUTA
    destino: EVENTO
    entidades:
      transcricao:
        modalidade: AUDIO
        sidecar:
          operacao:         {campo: OPERACAO_COD, transformacao: referencia, referencia: REF_OPERACAO}
          hora_transmissao: {campo: [OCORRENCIA_DATA, CHEGADA_DATA], transformacao: ts_iso,
                             observacao: "um campo, dois destinos: a mensagem de radio relata o que esta acontecendo AGORA, entao a hora da transmissao (relogio do gravador) vale como hora do fato e como chegada"}
          estacao:          {campo: UNIDADE_REPORTANTE_COD, transformacao: referencia, referencia: REF_UNIDADE,
                             observacao: "unidade dona do radio, pela sigla, como o gravador a cadastra"}
        campos:
          texto:    {campo: RELATO_TXT, transformacao: direto,
                     observacao: "saida do reconhecimento de fala. Os codinomes sao palavras raras: o transcritor recebe a lista de codinomes e lugares como vocabulario inicial (initial_prompt), e essa lista e versionada em EXTRACAO.PROMPT_VERSAO_COD como qualquer prompt."}
          codinome: {campo: TIPO_COD, transformacao: dominio, dominio: tipo_evento,
                     observacao: "'cavalo' casa com o sinonimo de AVISTAMENTO_INIMIGO"}
          referencia_local: {campo: GEOMETRIA_WKT, transformacao: gazetteer,
                             referencia: REF_GAZETTEER,
                             observacao: "'BR-154 km 43' -> ponto. Nao converte: consulta."}
          audio:       {campo: ARQUIVO_IDT, transformacao: referencia, referencia: ARQUIVO}
          _recepcao:   {campo: RECEPCAO_IDT, transformacao: referencia, referencia: RECEPCAO_BRUTA}
          _sistema:    {campo: SISTEMA_ORIGEM_COD, transformacao: constante, valor: VOZ}
          _modalidade: {campo: MODALIDADE_ORIGEM_COD, transformacao: constante, valor: AUDIO}
          _metodo:     {campo: LOCALIZACAO_METODO_COD, transformacao: constante, valor: GAZETTEER}
          _c2:         {campo: FUNCAO_C2_INDIC, transformacao: derivado,
                        observacao: "resolve para N. Radio e MEIO de transmissao de C2, nao sistema de informacao que registre o processo de estado-maior — mesma razao pela qual o documento avulso tambem nao conta."}
        extraidos_por_llm: [PRIORIDADE_COD, FUNCAO_COMBATE_COD]


# =============================================================================
# PARA AUMENTAR O ESCOPO
# =============================================================================
# O recorte atual gera dois documentos em PDF: o Relatorio de Bombardeio
# (FOGOS, tabular) e o informe de inteligencia (INTEL, prosa). Os demais anexos
# do manual de artilharia (Folha de Trabalho do S-2, Lista de Alvos, Arquivo
# Historico, Lista de Armas Inimigas) provam a mesma coisa do ponto de vista
# das teses — documento tabular que exige OCR — e por isso nao sao gerados. O
# mesmo vale para a 2a e a 3a partes do proprio Anexo I: estao no PDF, nao no
# de/para.
#
# Se for preciso incluir um deles:
#   1. acrescentar um bloco em `fontes`, no molde de FOGOS acima;
#   2. acrescentar o gerador correspondente em scripts/geradores/.
# Nenhum job e alterado, nenhuma tabela e recriada.
#
# Mesma regra para uma fonte com atributos proprios: alem do bloco em `fontes`,
# uma entidade de extensao no molde de SITUACAO_UNIDADE. So justifica-se quando
# o esquema da fonte for fixado por norma — se for variavel, o lugar dele e uma
# coluna semiestruturada, como ATRIBUTO_EXTRA_TXT.
#
# Nenhuma tabela Bronze nova por fonte: JSON entra em RECEPCAO_BRUTA, binario em
# ARQUIVO. Uma fonte estruturada nova (ex.: um C2_C que exporte XML) so
# acrescenta um bloco em `fontes` e, se a forma nao for JSON, um valor no
# dominio `modalidade`.
#
# Fonte com arquivo (qualquer modalidade): alem do bloco em `fontes`, declarar o
# `sidecar:` — o JSON de proveniencia que acompanha o arquivo. Vale para xlsx,
# PDF, imagem e audio: um mecanismo so. Sem sidecar, a operacao e a unidade so
# podem ser atribuidas por contexto (hora + area), com perda de certeza.
# REF_OPERACAO nao muda: uma operacao a mais e uma linha na seed operacoes.csv.
# =============================================================================
